version: '3.8'

services:
  # Nginx reverse proxy - single entry point for all services
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - react
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Next.js 16 app (Turbopack)
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - frontend
    restart: unless-stopped

  # React + Vite app
  react:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend: